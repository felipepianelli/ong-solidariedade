<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>ONG Solidariedade - Cadastro</title>
</head>

<body>

    <header>
        <h1>Cadastro de Voluntários</h1>
        <p>Preencha seus dados para participar das nossas ações.</p>
    </header>

    <nav aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="cadastro.html">Seja Voluntário</a>
    </nav>

    <main>

        <form action="#" method="post">

            <fieldset>
                <legend>Dados pessoais</legend>

                <p>
                    <label for="nome">Nome completo:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required>
                </p>

                <p>
                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>
                </p>

                <p>
                    <label for="nascimento">Data de nascimento:</label>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required>
                </p>

                <p>
                    <label for="cpf">CPF:</label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}"
                        title="Digite um CPF válido no formato 000.000.000-00"
                        required>
                </p>

            </fieldset>

            <fieldset>
                <legend>Endereço e contato</legend>

                <p>
                    <label for="telefone">Telefone:</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(11) 99999-9999"
                        pattern="\(?[0-9]{2}\)?[ ]?[0-9]{4,5}-?[0-9]{4}"
                        title="Digite um telefone válido, como (11) 99999-9999"
                        required>
                </p>

                <p>
                    <label for="cep">CEP:</label>
                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        placeholder="00000-000"
                        pattern="[0-9]{5}-?[0-9]{3}"
                        title="Digite um CEP válido no formato 00000-000"
                        required>
                </p>

                <p>
                    <label for="cidade">Cidade:</label>
                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        required>
                </p>

                <p>
                    <label for="estado">Estado:</label>
                    <input
                        type="text"
                        id="estado"
                        name="estado"
                        maxlength="2"
                        placeholder="SP"
                        required>
                </p>

            </fieldset>

            <fieldset>
                <legend>Forma de participação</legend>

                <p>
                    <label for="interesse">
                        Como deseja contribuir?
                    </label>

                    <select
                        id="interesse"
                        name="interesse"
                        required>

                        <option value="">
                            Selecione uma opção
                        </option>

                        <option value="doacao">
                            Doação
                        </option>

                        <option value="voluntariado">
                            Voluntariado
                        </option>

                        <option value="ambos">
                            Doação e voluntariado
                        </option>

                    </select>
                </p>

            </fieldset>

            <p>
                <button type="submit">
                    Enviar cadastro
                </button>
            </p>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 ONG Solidariedade. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
