<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONG Solidariedade</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- type="module" permite usar import/export entre os arquivos JS -->
    <script type="module" src="js/main.js"></script>
</head>

<body>

    <!-- Link para pular direto ao conteúdo (acessibilidade para teclado) -->
    <a class="pular-conteudo" href="#app">Pular para o conteúdo</a>

    <!-- ==========================================
         CABEÇALHO - fica fixo em todas as "páginas"
         ========================================== -->

    <header>

        <div class="marca">
            <p class="marca-nome">ONG Solidariedade</p>
            <p class="marca-slogan">Juntos podemos transformar vidas.</p>
        </div>

        <nav class="navegacao" aria-label="Navegação principal">

            <button
                class="menu-toggle"
                type="button"
                aria-label="Abrir menu"
                aria-expanded="false"
                aria-controls="menu-links">
                ☰
            </button>

            <!-- Os links usam # (hash). O JavaScript lê o hash e troca o conteúdo
                 do <main> sem recarregar a página: isso é a SPA. -->
            <div class="menu-links" id="menu-links">
                <a href="#/inicio" data-rota="inicio">Início</a>
                <a href="#/projetos" data-rota="projetos">Projetos</a>
                <a href="#/cadastro" data-rota="cadastro">Seja Voluntário</a>
                <a href="#/voluntarios" data-rota="voluntarios">Voluntários</a>
            </div>

        </nav>

    </header>


    <!-- ==========================================
         CONTEÚDO DINÂMICO
         O router.js coloca aqui o HTML da tela atual
         ========================================== -->

    <main id="app" tabindex="-1">
        <p class="carregando">Carregando...</p>
    </main>


    <!-- ==========================================
         RODAPÉ
         ========================================== -->

    <footer>
        <p>&copy; 2026 ONG Solidariedade. Todos os direitos reservados.</p>
    </footer>


    <!-- Área onde os avisos (toasts) aparecem. aria-live faz o leitor de tela anunciar. -->
    <div id="area-toast" class="area-toast" aria-live="polite"></div>

    <!-- Aviso caso o JavaScript esteja desligado -->
    <noscript>
        <p class="feedback-alerta">Ative o JavaScript para usar a plataforma.</p>
    </noscript>

</body>

</html>
